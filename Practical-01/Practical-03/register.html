<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Responsive Registration | Practical 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">StudentHub</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="register.html" class="nav-link active">Register</a></li>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="events.html" class="nav-link">Events</a></li>
            </ul>
        </div>
    </header>

    <main class="container">
        <div class="form-card">
            <h1 style="color: var(--primary); text-align: center; margin-bottom: 8px;">Create Student Account</h1>
            <p style="text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">Responsive form demonstrating mobile-first CSS Grid</p>

            <form action="dashboard.html" method="get">
                <div class="form-grid form-grid-2col">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="Rahul Patel" required>
                    </div>

                    <div class="form-group">
                        <label for="studentEmail">Email Address</label>
                        <input type="email" id="studentEmail" name="email" placeholder="rahul@charusat.edu.in" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile" name="mobile" placeholder="9876543210" required>
                    </div>

                    <div class="form-group">
                        <label for="department">Department</label>
                        <select id="department" name="department" required>
                            <option value="">Select Department</option>
                            <option value="IT">Information Technology</option>
                            <option value="CSE">Computer Science</option>
                            <option value="CE">Computer Engineering</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>
                </div>

                <div style="margin: 20px 0;">
                    <label style="font-size: 14px;">
                        <input type="checkbox" required> I agree to university computing guidelines
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">Register Now</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub | CHARUSAT FTE</p>
    </footer>
</body>
</html>
